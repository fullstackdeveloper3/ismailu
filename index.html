        /* =========================================
           1. FOUNDATION & VARIABLES (KAHVESI THEME)
           ========================================= */
        :root {
            /* Typography */
            --font-main: 'Cairo', 'Outfit', sans-serif;
            
            /* Colors */
            --brand-brown: #381A0F;      
            --brand-orange: #F39C12;     
            --brand-cream: #FDF5E6;      
            
            --text-primary: #2A1108;     
            --text-secondary: #5C3A21;   
            
            /* Warm Liquid Glass Specs */
            --glass-blur: blur(25px);
            --glass-bg: linear-gradient(135deg, rgba(253, 245, 230, 0.85) 0%, rgba(243, 156, 18, 0.2) 100%);
            --glass-border: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(243, 156, 18, 0.4) 100%);
            --glass-shadow: 0 12px 30px rgba(42, 17, 8, 0.25);
            
            /* Liquid Motion */
            --transition-smooth: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            color: var(--text-primary);
            background-color: #1A0A05;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .ambient-background {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1497935586351-b67a49e012bf?q=80&w=2500&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            z-index: -2;
            transform: scale(1.05);
            filter: brightness(0.6) contrast(1.2);
        }

        /* =========================================
           2. LIQUID GLASS MATERIAL COMPONENT
           ========================================= */
        .liquid-glass {
            position: relative;
            background: var(--glass-bg) padding-box, var(--glass-border) border-box;
            border: 1px solid transparent;
            border-radius: 20px;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: var(--glass-shadow);
            overflow: hidden;
            transform: translateZ(0);
        }

        .liquid-glass::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            opacity: 0.04; 
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* =========================================
           3. BRANDING & HEADER
           ========================================= */
        .brand-header {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-logo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 3px solid rgba(255, 255, 255, 0.4);
            margin-bottom: 20px;
            background-color: var(--brand-cream);
        }

        .location-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: linear-gradient(135deg, rgba(253, 245, 230, 0.9) 0%, rgba(243, 156, 18, 0.3) 100%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            color: var(--brand-brown);
            font-family: var(--font-main);
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 4px 15px rgba(42, 17, 8, 0.2);
            transition: all var(--transition-smooth);
        }

        .location-btn:hover {
            background: linear-gradient(135deg, rgba(243, 156, 18, 0.4) 0%, rgba(253, 245, 230, 0.95) 100%);
            box-shadow: 0 6px 20px rgba(42, 17, 8, 0.3);
            transform: translateY(-2px);
        }

        .location-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--brand-orange);
        }

        .header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .instagram-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;

            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            color: var(--brand-brown);

        }

        .instagram-btn:hover {

            transform: translateY(-2px);
        }

        .instagram-btn svg {
            width: 20px;
            height: 20px;
        }

        /* =========================================
           4. ARCHITECTURE & NAVIGATION
           ========================================= */
        .nav-container {
            position: fixed;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 24px;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
        }
        
        .nav-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        @media (min-width: 769px) {
            .nav-container {
                top: 32px;
                left: 50%;
                transform: translateX(-50%);
                width: auto;
                max-width: 90vw;
            }
        }

        @media (max-width: 768px) {
            .nav-container {
                top: 24px;
                left: 16px;
                right: 16px;
                padding: 10px;
            }
        }

        .nav-item {
            position: relative;
            z-index: 2;
            padding: 10px 20px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 0.95rem;
            transition: color var(--transition-smooth);
            cursor: pointer;
            white-space: nowrap;
        }

        .nav-item.active {
            color: var(--brand-brown);
        }

        .nav-slider {
            position: absolute;
            top: 8px;
            bottom: 8px;
            right: 0; /* Changed to right for RTL */
            background: rgba(243, 156, 18, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.15);
            transition: all var(--transition-smooth);
            z-index: 1;
            pointer-events: none;
        }

           5. CONTENT & EXPERIENCE
           ========================================= */
        main {

            color: var(--brand-brown);
            margin-bottom: 24px;
            text-align: center;
            border-bottom: 2px solid rgba(243, 156, 18, 0.3);
            padding-bottom: 10px;

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px dashed rgba(56, 26, 15, 0.2);
        }

        .menu-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .item-info h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);

            color: var(--brand-orange);
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

    </style>
</head>

                            <div class="price-col">
                                <span class="price-val">${item.price}</span>
                            </div>`;
                    }

                    sectionHTML += `</div></article>`;
                });

                section.innerHTML = sectionHTML;
                menuContainer.appendChild(section);
            });

            // Re-initialize Slider Logic (Adapted for RTL)
            const navItems = document.querySelectorAll('.nav-item');
            const slider = document.getElementById('navSlider');

            const updateSlider = (activeItem) => {
                const itemRect = activeItem.getBoundingClientRect();
                const navRect = activeItem.parentElement.getBoundingClientRect();
                
                // Calculate right position for RTL
                const rightPos = navRect.right - itemRect.right;
                
                slider.style.width = `${itemRect.width}px`;
                slider.style.transform = `translateX(${-rightPos}px)`; // Negative for RTL transform
            };

            const initialActive = document.querySelector('.nav-item.active');
            if(initialActive) {
                setTimeout(() => updateSlider(initialActive), 50); 
            }

            navItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault(); 
                    
                    navItems.forEach(nav => nav.classList.remove('active'));
                    this.classList.add('active');
                    updateSlider(this);

                    const targetId = this.getAttribute('href').substring(1);
                    const targetSection = document.getElementById(targetId);
                    if(targetSection) {
                        // Offset for fixed header
                        const yOffset = -100; 
                        const y = targetSection.getBoundingClientRect().top + window.pageYOffset + yOffset;
                        window.scrollTo({top: y, behavior: 'smooth'});
                    }
                });
            });

            window.addEventListener('resize', () => {
                const currentActive = document.querySelector('.nav-item.active');
                if(currentActive) updateSlider(currentActive);
            });
        });
    </script>
<script src="assets/js/item-links.js"></script>
